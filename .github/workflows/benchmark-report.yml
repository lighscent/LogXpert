name: benchmark-report

on:
  push:
    branches: [master]
    paths: [package.json]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version from package.json
        run: echo "TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - run: npm ci

      - run: npm run bench

      - name: Publish report for this version
        run: |
          STAMP=$(ls -d benchmarks/results/2* | sort | tail -n 1)
          DEST="benchmarks/reports/$TAG"
          mkdir -p "$DEST"
          cp "$STAMP"/* "$DEST/"
          node benchmarks/scripts/report.js --dir "$DEST"

      - name: Link latest report from README
        run: |
          node -e 'const fs=require("fs");const tag=process.env.TAG;const s=fs.readFileSync("README.md","utf8");const eol=s.includes("\r\n")?"\r\n":"\n";const i=s.indexOf("<!-- bench-report:start -->"),j=s.indexOf("<!-- bench-report:end -->");if(i<0||j<0||j<i){console.error("bench-report markers missing in README");process.exit(1)}const headEnd=s.indexOf("\n",i)+1;let tailStart=j;while(tailStart>0&&s[tailStart-1]!=="\n")tailStart-=1;const line=`Latest: [${tag}](benchmarks/reports/${tag}/REPORT.md) — [all version reports](benchmarks/reports/)`;fs.writeFileSync("README.md",s.slice(0,headEnd)+line+eol+s.slice(tailStart));'

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/reports README.md
          git diff --cached --quiet || git commit -m "docs: benchmark report for $TAG"
          git push
