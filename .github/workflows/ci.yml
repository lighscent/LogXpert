name: CI
permissions:
  contents: read
on:
  push:
    paths:
      - 'main.js'
      - 'main.mjs'
      - 'index.d.ts'
      - 'index.d.mts'
      - 'lib/**'
      - 'test/**'
      - 'test-d/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'main.js'
      - 'main.mjs'
      - 'index.d.ts'
      - 'index.d.mts'
      - 'lib/**'
      - 'test/**'
      - 'test-d/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run check:types
      - run: npm run attw
